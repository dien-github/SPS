<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>
  <!-- SPS D-Bus Policy - Prototype Mode -->

  <!-- Allow root-owned SPS services to own their bus names -->
  <policy user="root">
    <allow own="com.sps.auth"/>
    <allow own="com.sps.router"/>
    <allow own="com.sps.engine"/>
    <allow own="com.sps.netmgr"/>
    <allow own="com.sps.otamanager"/>

    <allow send_destination="com.sps.auth"/>
    <allow send_destination="com.sps.router"/>
    <allow send_destination="com.sps.engine"/>
    <allow send_destination="com.sps.netmgr"/>
    <allow send_destination="com.sps.otamanager"/>

    <allow receive_sender="com.sps.auth"/>
    <allow receive_sender="com.sps.router"/>
    <allow receive_sender="com.sps.engine"/>
    <allow receive_sender="com.sps.netmgr"/>
    <allow receive_sender="com.sps.otamanager"/>
  </policy>

  <!-- Prototype mode: allow local processes such as HMI to call SPS services -->
  <policy context="default">
    <allow send_destination="com.sps.auth"/>
    <allow send_destination="com.sps.router"/>
    <allow send_destination="com.sps.engine"/>
    <allow send_destination="com.sps.netmgr"/>
    <allow send_destination="com.sps.otamanager"/>

    <allow receive_sender="com.sps.auth"/>
    <allow receive_sender="com.sps.router"/>
    <allow receive_sender="com.sps.engine"/>
    <allow receive_sender="com.sps.netmgr"/>
    <allow receive_sender="com.sps.otamanager"/>
  </policy>
</busconfig>